[project]
name = "grain-backend"
version = "0.1.0"
description = "Python backend for Grain: memory, knowledge graph, documents, spaces, LiteLLM chat."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "ddgs>=9.0",
  "croniter>=3.0",
  "mcp>=2.2",
  # Validates the output of a headless coding run against its schema (extensions/coding/headless.py).
  "jsonschema>=4.20",
  "trafilatura>=1.12",
  # Platform readers (reach.py): YouTube transcripts/search, RSS/Atom
  "yt-dlp>=2025.1",
  "feedparser>=6.0",
  # Imported directly (embeddings, retrieval, image resizing); they used to arrive only through matplotlib.
  "numpy>=2.0",
  "pillow>=10.0",
  "google-api-python-client>=2.140",
  "google-auth-oauthlib>=1.2",
  # Linux secret store (osplat/linux_secrets.py): the freedesktop Secret Service over D-Bus.
  "keyring>=25; sys_platform == 'linux'",
]

[project.optional-dependencies]
# macOS system access (macos.py, voice input). Without these the frontmost-app probe falls back to
# `lsappinfo` (app name only) and permission checks report "unknown".
mac = [
  "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=10.3; sys_platform == 'darwin'",
  # Microphone authorization.
  "pyobjc-framework-AVFoundation>=10.3; sys_platform == 'darwin'",
  # On-device SFSpeechRecognizer, so voice input does not need whisper.cpp.
  "pyobjc-framework-Speech>=10.3; sys_platform == 'darwin'",
]
# Whistle: a 17 MB seven-language speech-to-text model that runs on the CPU in this process
# (voice.sttBackend = whistle). Its weights download from Hugging Face on first use.
whistle = [
  "cactus-needle>=3.1",
]
# run_python charts before the shared work environment (envs.py) has installed its own copy. No backend module
# imports it; the packaged build installs it so the first chart works offline.
charts = [
  "matplotlib>=3.8",
]

[project.scripts]
grain-backend = "personal_os.__main__:main"
grain = "personal_os.extensions.authoring.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["personal_os", "grain_sdk"]
# Explicit, so the connector catalog ships even though the root .gitignore skips `data/` folders (and hatch follows it).
artifacts = ["personal_os/data/*.json"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
# Correctness-only: pyflakes + pycodestyle errors/warnings, nothing stylistic.
select = ["E", "F", "W"]
ignore = ["F401", "F841", "E501", "E402", "E701", "E702", "E731", "E741"]
