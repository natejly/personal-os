# LiteLLM proxy config for Grain, routing to Fireworks AI.
# Start with:  ./scripts/litellm.sh   (reads .env)
# The model_name on the left is what you pick inside the app. Add any other provider
# here (openai/, anthropic/, gemini/, ollama/ ...) and it shows up automatically.
# Catalog checked against https://api.fireworks.ai/inference/v1/models on 2026-09-29.
model_list:
  - model_name: kimi-k3
    litellm_params:
      model: fireworks_ai/accounts/fireworks/models/kimi-k3
      api_key: os.environ/FIREWORKS_API_KEY
  # Fireworks "fast" router of the same model: more tokens per second, but measured on 2026-10-05 with the app's
  # real chat payload it took 7.4-7.8 s to the first token against 2.1-3.1 s for kimi-k3 above, tools or not.
  # A tool round emits ~200 tokens, so the wait before the first one is the whole cost: prefer kimi-k3 for chat.
  - model_name: kimi-k3-fast
    litellm_params:
      model: fireworks_ai/accounts/fireworks/routers/kimi-k3-fast
      api_key: os.environ/FIREWORKS_API_KEY
  - model_name: deepseek-v4-pro
    litellm_params:
      model: fireworks_ai/accounts/fireworks/models/deepseek-v4-pro
      api_key: os.environ/FIREWORKS_API_KEY
  - model_name: deepseek-v4-flash     # cheap + fast: default for auto-learn extraction
    litellm_params:
      model: fireworks_ai/accounts/fireworks/models/deepseek-v4p1-flash
      api_key: os.environ/FIREWORKS_API_KEY
  - model_name: qwen3.8-max
    litellm_params:
      model: fireworks_ai/accounts/fireworks/models/qwen3p8-max
      api_key: os.environ/FIREWORKS_API_KEY
  - model_name: glm-5.3
    litellm_params:
      model: fireworks_ai/accounts/fireworks/models/glm-5p3
      api_key: os.environ/FIREWORKS_API_KEY
  - model_name: glm-5.3-flash
    litellm_params:
      model: fireworks_ai/accounts/fireworks/models/glm-5p3-flash
      api_key: os.environ/FIREWORKS_API_KEY
  - model_name: minimax-m3
    litellm_params:
      model: fireworks_ai/accounts/fireworks/models/minimax-m3
      api_key: os.environ/FIREWORKS_API_KEY
  - model_name: gpt-oss-120b
    litellm_params:
      model: fireworks_ai/accounts/fireworks/models/gpt-oss-120b
      api_key: os.environ/FIREWORKS_API_KEY
  - model_name: kimi-k2.7-code
    litellm_params:
      model: fireworks_ai/accounts/fireworks/models/kimi-k2p7-code
      api_key: os.environ/FIREWORKS_API_KEY
  # Embeddings + reranking (for hybrid retrieval; see docs/research/roadmap.md)
  - model_name: qwen3-embedding-8b
    litellm_params:
      model: fireworks_ai/accounts/fireworks/models/qwen3-embedding-8b
      api_key: os.environ/FIREWORKS_API_KEY
      mode: embedding

  # ---------------------------------------------------------------- speech to text
  # Nothing above answers /v1/audio/transcriptions, so the meetings feature and the activity
  # monitor's audio signals have no transcription route on a default config: every clip fails,
  # keeps its wav, and waits for a retry. Fireworks deprecated audio transcription
  # (docs/research/roadmap.md:101), which is why there is no Fireworks entry to uncomment here.
  #
  # Pick ONE of the two blocks below, uncomment it, and press Test in Settings -> Meetings.
  # The model_name must stay `whisper-1`: that is meetings' `sttModel` default and
  # activity.py's `audio.model` default, so neither needs reconfiguring.
  #
  # You do not need either one. stt.py's local whisper.cpp backend is the no-cloud default and
  # needs no proxy route at all - `brew install whisper-cpp` plus a ggml model, and `sttBackend:
  # auto` picks it up (docs/meetings.md). Only add a route here if you want audio transcribed by
  # a provider instead of on this machine.
  #
  # GOTCHA, learnt the hard way on the embedding entry above: a `mode:` declaration belongs
  # under `model_info`, not under `litellm_params`. LiteLLM silently passes an unknown
  # litellm_params key through to the provider, which then 400s every call.

  # Any provider that serves the OpenAI transcription API.
  # - model_name: whisper-1
  #   litellm_params:
  #     model: openai/whisper-1
  #     api_key: os.environ/OPENAI_API_KEY
  #   model_info:
  #     mode: audio_transcription

  # A whisper.cpp server on this machine (`whisper-server --port 8080`), proxied so the app's
  # single base URL still reaches it. The api_key is ignored but must be present.
  # - model_name: whisper-1
  #   litellm_params:
  #     model: openai/whisper-1
  #     api_base: http://localhost:8080/v1
  #     api_key: not-needed
  #   model_info:
  #     mode: audio_transcription

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
