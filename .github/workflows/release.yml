name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest # arm64
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v5
      - run: npm ci
      # bundle-backend.sh -> electron-vite build -> electron-builder, signed with CSC_LINK and notarized
      # with the APPLE_* variables; --publish always uploads a prerelease to GitHub Releases.
      - run: npm run package -- --publish always
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GRAIN_GOOGLE_CLIENT_ID: ${{ secrets.GRAIN_GOOGLE_CLIENT_ID }}
          GRAIN_GOOGLE_CLIENT_SECRET: ${{ secrets.GRAIN_GOOGLE_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
