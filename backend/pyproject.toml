[project]
name = "grain-backend"
version = "0.1.0"
description = "Python backend for Grain: memory, knowledge graph, documents, spaces, LiteLLM chat."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "ddgs>=9.0",
  "croniter>=3.0",
  "mcp>=2.2",
  "trafilatura>=1.12",
  # Agent Reach platform readers (reach.py): YouTube transcripts/search, RSS/Atom
  "yt-dlp>=2025.1",
  "feedparser>=6.0",
  "matplotlib>=3.8",
  "google-api-python-client>=2.140",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
]

[project.optional-dependencies]
# Activity monitor (macOS). Without these the monitor still runs, but app tracking falls back to
# `lsappinfo` (app name only) and the keystroke/click tap is unavailable.
activity = [
  "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=10.3; sys_platform == 'darwin'",
  # Microphone authorization, AVAudioEngine capture, Core Audio process taps.
  "pyobjc-framework-AVFoundation>=10.3; sys_platform == 'darwin'",
  "pyobjc-framework-CoreAudio>=10.3; sys_platform == 'darwin'",
  # On-device SFSpeechRecognizer, so meetings/activity do not need whisper.cpp.
  "pyobjc-framework-Speech>=10.3; sys_platform == 'darwin'",
]

[project.scripts]
grain-backend = "personal_os.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["personal_os"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
# Correctness-only: pyflakes + pycodestyle errors/warnings, nothing stylistic.
select = ["E", "F", "W"]
ignore = ["F401", "F841", "E501", "E402", "E701", "E702", "E731", "E741"]
