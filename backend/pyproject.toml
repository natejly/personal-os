[project]
name = "grain-backend"
version = "0.1.0"
description = "Python backend for Grain: memory, knowledge graph, documents, spaces, LiteLLM chat."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "ddgs>=9.0",
  "mcp>=2.2",
  "trafilatura>=1.12",
  "matplotlib>=3.8",
  "google-api-python-client>=2.140",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
]

[project.scripts]
grain-backend = "personal_os.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["personal_os"]
